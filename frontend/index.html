<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Innovator Awards Photobooth</title>

<!-- Satoshi (sans) from Fontshare. Kalice (serif) isn't on a public CDN, so we
     @font-face it from /static/fonts/Kalice.woff2 if you drop the file there,
     and gracefully fall back to a serif otherwise. -->
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />

<style>
  /* ---- Brand fonts ---------------------------------------------------- */
  /* Drop Kalice into frontend/fonts/ (any of these filenames works). */
  @font-face {
    font-family: "Kalice";
    src: url("/static/fonts/Kalice-Regular.otf") format("opentype"),
         url("/static/fonts/Kalice.otf") format("opentype"),
         url("/static/fonts/Kalice-Regular.ttf") format("truetype"),
         url("/static/fonts/Kalice.ttf") format("truetype"),
         url("/static/fonts/Kalice.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  /* Optional local Satoshi (the CDN link above also covers it when online). */
  @font-face {
    font-family: "Satoshi";
    src: url("/static/fonts/Satoshi-Regular.otf") format("opentype"),
         url("/static/fonts/Satoshi-Regular.ttf") format("truetype"),
         url("/static/fonts/Satoshi.ttf") format("truetype");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Satoshi";
    src: url("/static/fonts/Satoshi-Bold.otf") format("opentype"),
         url("/static/fonts/Satoshi-Bold.ttf") format("truetype");
    font-weight: 700;
    font-display: swap;
  }

  :root {
    /* Palette pulled from image 4: black ground, purple smoke, neon-green accent */
    --bg: #000000;
    --bg-soft: #0c0613;
    --purple: #6a2a96;
    --magenta: #b146c2;
    --neon: #b9e84f;       /* accent green */
    --ink: #0a0a0a;
    --white: #f4f1ea;
    --muted: #b9a9d6;
    --serif: "Kalice", "Georgia", "Times New Roman", serif;
    --sans: "Satoshi", -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: var(--sans);
    color: var(--white);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }

  /* Portrait stage, sized for an iPad held upright. Black with a faint purple
     glow rising from the bottom, echoing the smoke artwork. */
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    max-width: 900px; margin: 0 auto;
    background:
      radial-gradient(90% 55% at 50% 118%, rgba(150,50,170,.55) 0%, rgba(80,30,120,.18) 38%, rgba(0,0,0,0) 68%),
      var(--bg);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* Neon green corner brackets. */
  .bracket { position: absolute; width: 46px; height: 46px; border: 3px solid var(--neon); z-index: 5; pointer-events: none; opacity: .85; }
  .bracket.tl { top: 22px; left: 22px; border-right: none; border-bottom: none; }
  .bracket.tr { top: 22px; right: 22px; border-left: none; border-bottom: none; }
  .bracket.bl { bottom: 22px; left: 22px; border-right: none; border-top: none; }
  .bracket.br { bottom: 22px; right: 22px; border-left: none; border-top: none; }

  /* ---- Header --------------------------------------------------------- */
  header { text-align: center; padding: 34px 24px 10px; z-index: 2; }
  header .logo { max-height: 52px; max-width: 78%; width: auto; margin: 0 auto 14px; display: block; }
  header .eyebrow {
    font-family: var(--sans); font-weight: 700; letter-spacing: .14em;
    font-size: 14px; color: var(--neon); margin-bottom: 10px;
  }
  header h1 {
    font-family: var(--serif); font-weight: 400; line-height: .98;
    font-size: clamp(34px, 8vw, 60px); margin: 0; color: var(--white);
  }

  /* ---- Screens -------------------------------------------------------- */
  .screen { flex: 1; display: none; flex-direction: column; align-items: center;
            justify-content: center; padding: 16px 24px 36px; z-index: 2; min-height: 0; }
  .screen.active { display: flex; }

  /* Media frame shared by camera / confirm / result.
     We force a square box via padding-top (100% of width) instead of relying on
     aspect-ratio, because the <video>/<img> child would otherwise drive the
     height and make the box landscape. Children are absolutely positioned to
     fill the square and object-fit:cover crops the feed to a centered square.
     The width is also capped to the available height (reserving room for the
     header, buttons and footer) so the CAPTURE button is never clipped. */
  .frame {
    position: relative;
    width: min(540px, calc(100vh - 360px));   /* square side, never too tall */
    height: 0; padding-top: min(540px, calc(100vh - 360px));
    border-radius: 18px; overflow: hidden;
    background: #0d0820; border: 2px solid rgba(200,255,77,.35);
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .frame video, .frame img, .frame canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  /* Selfie feel: mirror the live preview. The capture is mirrored to match (see
     captureFrame), so the preview and the final photo look the same. */
  #video { transform: scaleX(-1); }

  /* ---- Buttons -------------------------------------------------------- */
  .btn-row { display: flex; gap: 16px; margin-top: 26px; width: 100%; max-width: 560px; }
  button {
    font-family: var(--sans); font-weight: 700; font-size: 20px;
    border: none; border-radius: 999px; padding: 20px 24px; cursor: pointer;
    flex: 1; letter-spacing: .04em; transition: transform .06s ease, opacity .15s ease;
  }
  button:active { transform: scale(.97); }
  .btn-primary { background: var(--neon); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--white); border: 2px solid rgba(255,255,255,.5); }
  .btn-capture {
    font-size: 24px; padding: 24px; background: var(--neon); color: var(--ink);
    box-shadow: 0 0 0 6px rgba(200,255,77,.18), 0 14px 40px rgba(200,255,77,.25);
  }

  /* ---- Loading -------------------------------------------------------- */
  .spinner {
    width: 84px; height: 84px; border-radius: 50%;
    border: 7px solid rgba(255,255,255,.12); border-top-color: var(--neon);
    animation: spin 1s linear infinite; margin-bottom: 30px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingMsg {
    font-family: var(--sans); font-weight: 500; font-size: 19px;
    color: var(--muted); min-height: 26px; text-align: center; max-width: 460px;
  }
  .loading-title { font-family: var(--serif); font-size: 32px; margin-bottom: 4px; color: var(--white); }
  .loading-sub { font-family: var(--sans); font-weight: 700; font-size: 13px; letter-spacing: .12em;
                 text-transform: uppercase; color: var(--neon); margin-bottom: 22px; }
  .progress {
    width: min(420px, 70vw); height: 8px; margin-top: 26px;
    background: rgba(255,255,255,.10); border-radius: 999px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--purple), var(--neon));
    transition: width .4s ease;
  }
  .progress-pct {
    font-family: var(--sans); font-weight: 700; font-size: 14px;
    color: var(--neon); margin-top: 10px; letter-spacing: .04em;
  }

  /* ---- Error ---------------------------------------------------------- */
  .error-box { text-align: center; max-width: 480px; }
  .error-box .x { font-size: 60px; color: var(--neon); margin-bottom: 12px; }
  .error-box h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; margin: 0 0 14px; }
  #errorMsg { font-family: var(--sans); color: #d9c4ff; font-size: 15px; line-height: 1.5;
              word-break: break-word; margin-bottom: 24px; }

  /* ---- Identify card -------------------------------------------------- */
  .id-card {
    width: 100%; max-width: 560px; background: rgba(255,255,255,.05);
    border: 2px solid rgba(200,255,77,.30); border-radius: 18px; padding: 28px 26px;
  }
  /* Editable inline sentence: "Is [name] from [company]?" */
  .id-sentence {
    font-family: var(--serif); font-size: clamp(28px, 5.2vw, 40px);
    color: var(--white); line-height: 1.5; text-align: center;
  }
  .id-sentence .id-word, .id-sentence #idLead, .id-sentence #idTail { color: var(--white); }
  .inline-input {
    font-family: var(--serif); font-size: inherit; color: var(--neon);
    background: transparent; border: none; border-bottom: 2px dashed rgba(185,232,79,.5);
    outline: none; text-align: center; padding: 0 4px; min-width: 2ch;
  }
  .inline-input::placeholder { color: var(--muted); opacity: .7; }
  .inline-input:focus { border-bottom-style: solid; border-bottom-color: var(--neon); }
  .id-hint { font-family: var(--sans); font-size: 13px; color: var(--muted); margin-top: 18px; text-align: center; }

  /* ---- Result strip (tall) ------------------------------------------- */
  .strip-wrap { flex: 1; display: flex; align-items: center; justify-content: center;
                width: 100%; min-height: 0; }
  .sent-msg { font-family: var(--serif); font-size: 22px; color: var(--white);
              text-align: center; max-width: 560px; margin: 8px auto 0; line-height: 1.35; }
  .sent-msg b { color: var(--neon); font-family: var(--sans); font-weight: 700; }
  .strip-wrap img {
    max-height: 100%; max-width: 86%; width: auto; height: auto;
    border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); object-fit: contain;
  }
</style>
</head>
<body>
<div id="stage">
  <span class="bracket tl"></span><span class="bracket tr"></span>
  <span class="bracket bl"></span><span class="bracket br"></span>

  <header>
    <!-- Drop your lockup at frontend/logo.png (or .svg). If it's missing, the
         text fallback below is shown automatically. -->
    <img id="brandLogo" class="logo" src="/static/logo.png" alt="HackerRank x ET HRWorld"
         onerror="this.style.display='none';document.getElementById('brandEyebrow').style.display='block';" />
    <div class="eyebrow" id="brandEyebrow" style="display:none;">HackerRank &nbsp;×&nbsp; ET HRWorld</div>
    <h1>Innovator Awards</h1>
  </header>

  <!-- SCREEN 1: live camera -->
  <section id="screen-camera" class="screen active">
    <div class="frame">
      <video id="video" autoplay playsinline muted></video>
    </div>
    <div class="btn-row">
      <button class="btn-capture" id="btnCapture">Capture</button>
    </div>
  </section>

  <!-- SCREEN 2: confirm the shot -->
  <section id="screen-confirm" class="screen">
    <div class="frame">
      <img id="previewImg" alt="Your photo" />
    </div>
    <div class="btn-row">
      <button class="btn-ghost" id="btnRetake">Retake</button>
      <button class="btn-primary" id="btnStylize">Continue</button>
    </div>
  </section>

  <!-- SCREEN 2b: confirm / enter identity (editable inline sentence) -->
  <section id="screen-identify" class="screen">
    <div class="id-card">
      <div class="id-sentence">
        <span id="idLead">Is this</span>
        <input id="inputName" class="inline-input" type="text" placeholder="your name" autocomplete="off" />
        <span class="id-word">from</span>
        <input id="inputCompany" class="inline-input" type="text" placeholder="your company" autocomplete="off" />
        <span id="idTail">?</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-ghost" id="btnIdBack">Back</button>
      <button class="btn-primary" id="btnMakeStrip">Print My Strip</button>
    </div>
  </section>

  <!-- SCREEN 3: loading -->
  <section id="screen-loading" class="screen">
    <div class="spinner"></div>
    <div class="loading-title" id="loadingTitle">Generating your AI portrait</div>
    <div class="loading-sub" id="loadingSub">AI is reimagining your photo</div>
    <div id="loadingMsg">Warming up the model</div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-pct" id="progressPct">0%</div>
  </section>

  <!-- SCREEN 4: result (tall photo strip) -->
  <section id="screen-result" class="screen">
    <div class="strip-wrap">
      <img id="resultImg" alt="Your photo strip" />
    </div>
    <div id="sentMsg" class="sent-msg" style="display:none;"></div>
    <div class="btn-row">
      <button class="btn-ghost" id="btnNew">Start Over</button>
      <button class="btn-primary" id="btnPrint">Send to Print</button>
    </div>
  </section>

  <!-- SCREEN 5: error -->
  <section id="screen-error" class="screen">
    <div class="error-box">
      <div class="x">⚠</div>
      <h2>Something Glitched</h2>
      <div id="errorMsg">Unknown error.</div>
      <div class="btn-row" style="max-width:320px;margin:0 auto;">
        <button class="btn-primary" id="btnErrorRetry">Try Again</button>
      </div>
    </div>
  </section>
</div>

<!-- Hidden canvas used to grab + un-mirror the captured frame -->
<canvas id="canvas" style="display:none;"></canvas>

<script>
/* ====================================================================== *
 *  CONFIG
 * ====================================================================== */

// Where the backend lives. Empty string = same origin as this page, which is
// the case when the FastAPI server serves this file (the easy local setup).
// For the event, when the frontend is on its own https tunnel, set this to the
// backend's public https URL, e.g. "https://your-backend.ngrok.app".
const BACKEND_URL = "";

// Capture as a square (1:1). The printed photo and the fal output are square.
const CAPTURE_W = 1080, CAPTURE_H = 1080;

/* ====================================================================== *
 *  Tiny helpers
 * ====================================================================== */
const $ = (id) => document.getElementById(id);
const screens = {
  camera:   $("screen-camera"),
  confirm:  $("screen-confirm"),
  identify: $("screen-identify"),
  loading:  $("screen-loading"),
  result:   $("screen-result"),
  error:    $("screen-error"),
};
function show(name) {
  Object.values(screens).forEach((s) => s.classList.remove("active"));
  screens[name].classList.add("active");
}

/* ====================================================================== *
 *  Camera
 * ====================================================================== */
const video = $("video");
let stream = null;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 1707 } },
      audio: false,
    });
    video.srcObject = stream;
  } catch (err) {
    showError(
      "Camera unavailable. Allow camera access, and remember the camera only " +
      "works over https or on localhost. (" + err.message + ")"
    );
  }
}

/* Grab the current video frame into the canvas as a centered square crop, and
   MIRROR it so the captured photo matches the mirrored (selfie) live preview. */
function captureFrame() {
  const canvas = $("canvas");
  canvas.width = CAPTURE_W;
  canvas.height = CAPTURE_H;
  const ctx = canvas.getContext("2d");

  // Center-crop the video to a square region.
  const vw = video.videoWidth, vh = video.videoHeight;
  const targetRatio = CAPTURE_W / CAPTURE_H;
  let sw = vw, sh = vw / targetRatio;
  if (sh > vh) { sh = vh; sw = vh * targetRatio; }
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;

  // Flip horizontally so the saved frame mirrors the preview (selfie feel).
  ctx.translate(CAPTURE_W, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, CAPTURE_W, CAPTURE_H);
  return canvas;
}

/* ====================================================================== *
 *  Screen flow
 * ====================================================================== */
let capturedBlob = null;

$("btnCapture").addEventListener("click", () => {
  const canvas = captureFrame();
  $("previewImg").src = canvas.toDataURL("image/jpeg", 0.92);
  canvas.toBlob((blob) => { capturedBlob = blob; }, "image/jpeg", 0.92);
  show("confirm");
});

$("btnRetake").addEventListener("click", () => show("camera"));

// Continue -> run face recognition (separate, quick step), then show the
// pre-filled confirm screen. Recognition and the slow strip generation are kept
// as two sequential steps so neither feels like one long hang.
$("btnStylize").addEventListener("click", async () => {
  if (!capturedBlob) { showError("No photo captured."); return; }
  $("loadingTitle").textContent = "Recognizing you";
  $("loadingSub").textContent = "AI face matching";
  $("loadingMsg").textContent = "Matching your face";
  startProgress(6);            // recognition is quick
  show("loading");
  let data = {};
  try {
    const form = new FormData();
    form.append("photo", capturedBlob, "photo.jpg");
    const res = await fetch(BACKEND_URL + "/identify", { method: "POST", body: form });
    data = res.ok ? await res.json() : {};
  } catch (e) { /* recognition is best-effort */ }
  stopProgress();
  $("inputName").value = data.name || "";
  $("inputCompany").value = data.company || "";
  // Recognized -> "Is this [name] from [company]?"; not recognized -> "You're [..]"
  // with empty blanks they fill in. Either way the blanks edit inline.
  if (data.name) {
    $("idLead").textContent = "Is this";
    $("idTail").textContent = "?";
  } else {
    $("idLead").textContent = "You're";
    $("idTail").textContent = "";
  }
  autosize($("inputName"));
  autosize($("inputCompany"));
  show("identify");
});

// Make the inline inputs grow/shrink to fit their text (or placeholder).
function autosize(el) {
  const len = (el.value || el.placeholder || "").length;
  el.size = Math.max(len + 1, 4);
}
$("inputName").addEventListener("input", (e) => autosize(e.target));
$("inputCompany").addEventListener("input", (e) => autosize(e.target));

$("btnIdBack").addEventListener("click", () => show("confirm"));

// Print My Strip -> build the two-pose strip with the confirmed name.
$("btnMakeStrip").addEventListener("click", () => {
  if (!capturedBlob) { showError("No photo captured."); return; }
  $("loadingTitle").textContent = "Generating your AI portrait";
  $("loadingSub").textContent = "AI is reimagining your photo";
  startLoadingMessages();
  startProgress(55);           // two stylizations take a while
  show("loading");
  makeStrip(capturedBlob, $("inputName").value.trim(), $("inputCompany").value.trim());
});

$("btnNew").addEventListener("click", resetToCamera);
$("btnErrorRetry").addEventListener("click", resetToCamera);

let sentResetTimer = null;

function resetToCamera() {
  clearTimeout(sentResetTimer);
  capturedBlob = null;
  $("resultImg").src = "";
  $("inputName").value = "";
  $("inputCompany").value = "";
  // Reset the result screen's print state for the next guest.
  $("sentMsg").style.display = "none";
  const pb = $("btnPrint");
  pb.textContent = "Send to Print";
  pb.disabled = false;
  show("camera");
}

// Friendly confirmation after the strip is sent off to the (offsite) printer,
// then auto-reset to the camera for the next guest (hands-free).
function showSentMessage(name) {
  const who = name ? name.split(" ")[0] : "";
  const hi = who ? ("All set, " + who + "! ") : "All set! ";
  $("sentMsg").innerHTML = hi + "Your strip is printing — <b>collect it just outside the booth.</b>";
  $("sentMsg").style.display = "block";
  clearTimeout(sentResetTimer);
  sentResetTimer = setTimeout(resetToCamera, 7000);   // back to camera in 7s
}

/* ====================================================================== *
 *  Loading: rolling status words + a progress bar
 * ====================================================================== */
const LOADING_MESSAGES = [
  "AI is studying your photo",
  "Generating your portrait",
  "Dithering the shadows",
  "Mixing indigo and magenta",
  "Crosshatching highlights",
  "Writing your couplet",
  "Cutting you from the background",
  "Placing you on the stage",
  "Rendering your strip",
  "Almost there, looking sharp",
];
let loadingTimer = null;
function startLoadingMessages() {
  let i = 0;
  $("loadingMsg").textContent = LOADING_MESSAGES[0];
  clearInterval(loadingTimer);
  loadingTimer = setInterval(() => {
    i = (i + 1) % LOADING_MESSAGES.length;
    $("loadingMsg").textContent = LOADING_MESSAGES[i];
  }, 1600);
}
function stopLoadingMessages() { clearInterval(loadingTimer); }

/* Smooth fake-but-honest progress: creep toward 95% over `etaSeconds`, then
   jump to 100% when the request actually finishes. */
let progressTimer = null, progressVal = 0;
function startProgress(etaSeconds) {
  progressVal = 0;
  setProgress(0);
  clearInterval(progressTimer);
  const stepMs = 250;
  const perStep = 95 / ((etaSeconds * 1000) / stepMs);
  progressTimer = setInterval(() => {
    progressVal = Math.min(95, progressVal + perStep);
    setProgress(progressVal);
  }, stepMs);
}
function setProgress(pct) {
  const p = Math.round(pct);
  $("progressBar").style.width = p + "%";
  $("progressPct").textContent = p + "%";
}
function stopProgress() {
  clearInterval(progressTimer);
  setProgress(100);
}

/* ====================================================================== *
 *  Talk to the backend
 * ====================================================================== */
async function makeStrip(blob, name, company) {
  const form = new FormData();
  form.append("photo", blob, "photo.jpg");
  form.append("name", name);
  form.append("company", company);
  try {
    const res = await fetch(BACKEND_URL + "/generate_strip", { method: "POST", body: form });
    if (!res.ok) {
      const text = await res.text();
      throw new Error("Server " + res.status + ": " + text);
    }
    const data = await res.json();
    stopLoadingMessages();
    stopProgress();
    $("resultImg").src = data.image_url;
    lastResultFile = (data.image_url || "").split("/").pop();  // basename for /print
    show("result");
  } catch (err) {
    stopLoadingMessages();
    stopProgress();
    showError(err.message || String(err));
  }
}

function showError(msg) {
  $("errorMsg").textContent = msg;
  show("error");
}

/* ====================================================================== *
 *  Print
 * ====================================================================== */
let lastResultFile = "";

// Primary: ask the backend to send the strip straight to the DS620A (CUPS).
// Fallback: if the backend can't print (no printer / disabled / offline), open
// the browser print dialog so you can still get a copy.
$("btnPrint").addEventListener("click", async () => {
  const btn = $("btnPrint");
  const original = btn.textContent;
  if (lastResultFile) {
    btn.textContent = "Sending";
    btn.disabled = true;
    try {
      const form = new FormData();
      form.append("filename", lastResultFile);
      form.append("name", $("inputName").value.trim());
      const res = await fetch(BACKEND_URL + "/print", { method: "POST", body: form });
      const data = await res.json();
      if (data.ok) {
        btn.textContent = "Sent ✓";
        showSentMessage($("inputName").value.trim());
        return;
      }
      console.warn("Backend print failed, falling back to browser:", data.error);
    } catch (e) {
      console.warn("Print request failed, falling back to browser:", e);
    }
    btn.textContent = original;
    btn.disabled = false;
  }
  browserPrint($("resultImg").src);
});

// Browser print fallback: open the strip and size the page to its aspect ratio.
function browserPrint(url) {
  if (!url) return;
  const w = window.open("", "_blank");
  if (!w) { alert("Allow pop-ups to print, or set up the DS620A printer."); return; }
  w.document.write(
    '<html><head><title>Print</title>' +
    '<style>html,body{margin:0;height:100%}' +
    'img{width:100%;height:100%;object-fit:contain;display:block}</style>' +
    '</head><body><img id="p" src="' + url + '" /></body></html>'
  );
  w.document.close();
  const img = w.document.getElementById("p");
  img.onload = function () {
    const ar = img.naturalWidth / img.naturalHeight;
    let win = 6, hin = 6;
    if (ar >= 1) { hin = 6 / ar; } else { win = 6 * ar; }
    const style = w.document.createElement("style");
    style.textContent = "@page{size:" + win.toFixed(2) + "in " + hin.toFixed(2) + "in;margin:0}";
    w.document.head.appendChild(style);
    w.focus();
    w.print();
  };
}

/* ====================================================================== *
 *  Boot
 * ====================================================================== */
startCamera();
</script>
